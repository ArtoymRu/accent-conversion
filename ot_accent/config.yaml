# Paths. The corpora are only read by experiments/extract.py.
l2_arctic: data/l2arctic        # <SPEAKER>/{wav,transcript,textgrid}/ or <accent>/<SPEAKER>/...
cmu_arctic: null                # optional: cmu_us_<spk>_arctic/{wav,lab,etc}/ adds the accent "native"
cache: cache                    # one .npz per speaker: statistics and frames
results: results                # csv, figures, audio

device: cuda
layers: [3, 6, 9, 12, 18, 24]   # statistics are kept for each of these (E1)
edit_layer: 6                   # edits and vocoding happen here (the kNN-VC vocoder inverts layer 6)
max_utts: null                  # utterances per speaker used for statistics; null = all
test_utts: 10                   # per speaker: held out of all statistics, edited and scored (E0, E2)
pool_utts: 100                  # per speaker: frames kept as neighbours for barycentric maps

accents: null                   # accents used by the experiments; null = every accent in the cache
pairs: all                      # E2, E4: all | cyclic | [[source, target], ...]
systems: null                   # E2: null = every map, or a list of names from e2_maps.build_systems
strengths: [1.0]                # E2: add 0.5, 1.5, 2.0 for the strength sweep (E6)
knn: 4
prematched_vocoder: true        # vocoder trained on kNN-matched frames: more tolerant of edited frames
audio_metrics: true             # WER (Whisper), speaker cosine (Resemblyzer and ECAPA); false = frame metrics only
whisper: base                   # PACE reports Whisper-base
seed: 0
